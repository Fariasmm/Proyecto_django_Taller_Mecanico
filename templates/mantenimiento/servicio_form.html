{% extends 'base.html' %}

{% block title %}{{ titulo }} | MotoTechPro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0 fw-bold">{{ titulo }}</h5>
            </div>
            <div class="card-body p-4 bg-white">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'mantenimiento_servicios' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary fw-bold">Guardar Servicio</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
