{% extends 'base.html' %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white fw-bold">
                Confirmar Eliminación
            </div>
            <div class="card-body text-center p-4">
                <h5>¿Estás seguro de que deseas eliminar el servicio?</h5>
                <p class="text-danger fw-bold fs-5 my-3">{{ servicio.nombre }} ({{ servicio.codigo }})</p>
                <p class="text-muted small">Esta acción no se puede deshacer.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'mantenimiento_servicios' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sí, Eliminar Registro</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
