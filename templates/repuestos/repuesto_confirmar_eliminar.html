{% extends 'base.html' %}

{% block title %}Eliminar Repuesto{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white fw-bold">Confirmar Eliminación de Repuesto</div>
            <div class="card-body text-center p-4">
                <h5>¿Seguro que deseas eliminar este repuesto del inventario?</h5>
                <p class="text-danger fw-bold fs-5 my-3">{{ repuesto.nombre }} ({{ repuesto.codigo }})</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'repuestos_catalogo' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
